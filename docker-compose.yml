version: "3.9"

services:

  # ==========================================
  # MySQL Database
  # ==========================================
  mysql:

    image: mysql:8.0

    container_name: thulasi-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: thulasi_chats

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ==========================================
  # Spring Boot Backend
  # ==========================================
  backend:

    build:
      context: ./backend

    image: thulasi-chats-backend:1.0

    container_name: thulasi-backend

    restart: always

    depends_on:
      mysql:
        condition: service_healthy

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/thulasi_chats

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: root

      SERVER_PORT: 8081

    ports:
      - "8081:8081"

  # ==========================================
  # React Frontend
  # ==========================================
  frontend:

    build:
      context: ./frontend

    image: thulasi-chats-frontend:1.0

    container_name: thulasi-frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "3000:80"

volumes:

  mysql-data:
